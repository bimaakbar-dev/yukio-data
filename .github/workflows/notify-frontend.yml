name: Notify Frontend

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger yukionime rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.FRONTEND_PAT }}
          repository: bimaakbar-dev/yukionime
          event-type: data-updated
