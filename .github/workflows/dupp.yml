name: Detect Duplicate Slugs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run detector
        run: |
          node --version
          node detect-duplicate-slugs.mjs
          echo "=== file.txt ==="
          wc -l file.txt

      - name: Push to dump branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/dump-repo && cd /tmp/dump-repo
          git init -b dump
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch origin dump 2>/dev/null; then git checkout -B dump FETCH_HEAD; fi
          cp "${GITHUB_WORKSPACE}/file.txt" ./file.txt
          git add file.txt
          if git diff --cached --quiet; then
            echo "ℹ️ No changes"
            exit 0
          fi
          git commit -m "chore: duplicate slug report [skip ci]"
          git push origin dump
          echo "🔗 https://github.com/${REPO}/blob/dump/file.txt" >> "$GITHUB_STEP_SUMMARY"
