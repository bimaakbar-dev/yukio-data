name: Migrate rating → stats.score

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (tidak commit)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Dry run
        if: ${{ inputs.dry_run }}
        env:
          DRY_RUN: '1'
        run: node migrate-rating.mjs

      - name: Write migration
        if: ${{ !inputs.dry_run }}
        run: node migrate-rating.mjs

      - name: Commit & push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content/anime
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "chore(data): migrate rating (skor) ke stats.score"
            git push
          fi